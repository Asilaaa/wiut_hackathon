# Production stack on the team server: HTTPS reverse proxy + live-demo API.
#   The website's static build is rsynced into ${SITE_DIR} by the web repo's workflow.
#   Values come from deploy/.env (written by the deploy workflow, see .env.example).
services:
  demo:
    image: ghcr.io/ctrl-alt-elite-newuu/traffic-event-detection-demo:${DEMO_TAG:-latest}
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-150}
      CORS_ORIGINS: https://${DOMAIN}
    volumes:
      - demo-jobs:/data/jobs

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [demo]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SITE_DIR:-/srv/site}:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  demo-jobs:
  caddy-data:
  caddy-config:
